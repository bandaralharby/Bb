<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>رحلة التجارة الإلكترونية | ثالث متوسط</title><style>
:root{--bg:#071326;--panel:#112542;--panel2:#183354;--line:#35516f;--text:#f5f9ff;--muted:#bad0e6;--mint:#56e5be;--gold:#ffd17b;--pink:#ff8da8;--blue:#89b9ff}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Tahoma,'Segoe UI',Arial,sans-serif}body{background:radial-gradient(circle at 15% 10%,#173a58 0,transparent 38%),radial-gradient(circle at 90% 80%,#232253 0,transparent 35%),var(--bg)}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:3px}.app{height:100dvh;display:grid;grid-template-rows:auto 5px minmax(0,1fr) auto}.top,.bottom{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 24px;background:#091a2de8;border-bottom:1px solid #284563}.bottom{border-bottom:0;border-top:1px solid #284563}.brand{font-weight:900;font-size:clamp(15px,1.4vw,22px)}.tag{color:var(--mint);font-size:13px}.progress{background:#243e59}.progress>div{height:100%;background:linear-gradient(90deg,#56e5be,#8ab9ff,#dca4ff);transition:width .3s}.main{overflow:auto;min-height:0;padding:clamp(12px,2vw,26px) clamp(12px,3vw,45px) 35px}.stage{max-width:1300px;margin:auto;min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:17px;animation:appear .35s both}@keyframes appear{from{opacity:.4;transform:translateY(12px)}to{opacity:1;transform:none}}h1,h2,h3,p{margin:0}h1{font-size:clamp(30px,4.7vw,65px);line-height:1.35}h2{font-size:clamp(24px,3vw,42px)}h3{font-size:clamp(18px,1.8vw,26px)}p{font-size:clamp(16px,1.5vw,22px);line-height:1.85;color:var(--muted)}.eyebrow{color:var(--mint);font-size:15px;font-weight:bold}.split{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:center}.panel{background:linear-gradient(145deg,#173451ed,#10243eed);border:1px solid #355472;border-radius:24px;padding:clamp(17px,2vw,28px);box-shadow:0 18px 36px #0003}.hero{font-size:clamp(110px,17vw,235px);text-align:center;filter:drop-shadow(0 20px 18px #0006);animation:bob 3.5s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-14px) rotate(-3deg)}}.btn{border:0;background:var(--mint);color:#09283b;font-weight:900;padding:13px 20px;border-radius:14px;box-shadow:0 5px 0 #239b80;transition:transform .12s}.btn:active{transform:translateY(4px);box-shadow:none}.btn.secondary{background:#233d5c;color:white;box-shadow:none;border:1px solid #537294}.btn.gold{background:var(--gold);box-shadow:0 5px 0 #aa8242}.btn:disabled{opacity:.45;cursor:default}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:15px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.cards.two{grid-template-columns:repeat(2,minmax(0,1fr))}.tile{background:#172e4a;border:1px solid #42617d;border-radius:19px;padding:22px;min-width:0;transition:transform .2s,border-color .2s}.tile:hover{transform:translateY(-3px);border-color:var(--mint)}.emoji{font-size:clamp(44px,6vw,76px);margin-bottom:12px}.tile h3{margin-bottom:8px}.tile p{font-size:16px}.pill{display:inline-block;padding:7px 12px;border-radius:30px;background:#24435b;color:#cdefff;font-weight:bold;margin:4px}.question{font-size:clamp(22px,2.5vw,32px);font-weight:bold;margin:10px 0 18px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.choice{background:#1c3b5a;border:2px solid #4b6b87;border-radius:16px;padding:16px;color:white;text-align:right;font-weight:bold;font-size:clamp(16px,1.5vw,21px)}.choice:hover{border-color:var(--mint)}.choice.correct{background:#145b4e;border-color:var(--mint)}.choice.wrong{background:#683446;border-color:var(--pink)}.feedback{margin-top:14px;min-height:36px;font-size:19px;font-weight:bold;color:var(--gold)}.products{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.product{background:#f7fbff;color:#163251;border-radius:17px;padding:17px;text-align:center}.product .emoji{font-size:60px}.product strong{display:block;font-size:20px}.product p{color:#315675;font-size:16px}.product .btn{margin-top:10px}.receipt{background:#f7fbff;color:#123451;border-radius:18px;padding:20px}.receipt h3{color:#123451}.receipt p{color:#315675}.rowline{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed #a9bbcc;padding:10px 0;font-size:18px}.notice{border-right:5px solid var(--mint);background:#1b4b57;padding:15px;border-radius:12px;font-size:17px;line-height:1.7}.warning{border-right-color:var(--pink);background:#553044}.big-number{font-size:clamp(42px,6vw,80px);font-weight:900;color:var(--gold)}.badge{color:var(--mint);font-weight:bold}.stepbar{display:flex;gap:8px;flex-wrap:wrap}.stepbar span{padding:9px 15px;background:#244562;border-radius:12px;font-weight:bold}.stepbar .on{background:var(--mint);color:#0c283c}.url{direction:ltr;text-align:left;background:#08182b;padding:16px;border-radius:12px;font-family:Consolas,monospace;overflow-wrap:anywhere;font-size:clamp(14px,1.5vw,21px)}.checkrow{display:flex;align-items:center;gap:12px;padding:12px 0;font-size:19px}.checkrow input{width:22px;height:22px}.field{background:#10283f;border:1px solid #537294;border-radius:12px;color:white;padding:12px;width:100%;font-size:18px}.count{color:#c6d9ea;font-weight:bold}.kbd{border:1px solid #7891a9;border-radius:6px;padding:3px 8px}.confetti{font-size:100px;text-align:center;animation:bob 3s infinite}.footer-note{font-size:12px;color:#9bb4cb}@media(max-width:850px){.split,.cards,.cards.two,.products{grid-template-columns:1fr}.hero{font-size:90px}.stage{justify-content:flex-start}.choices{grid-template-columns:1fr}.top,.bottom{padding:10px}.brand{font-size:14px}.main{padding:13px 12px 28px}.panel{padding:16px}.btn{padding:11px 13px}}@media(max-height:720px) and (min-width:851px){.stage{gap:10px;justify-content:flex-start}.panel{padding:16px}.hero{font-size:130px}.tile{padding:14px}.emoji{font-size:45px;margin-bottom:6px}h1{font-size:44px}h2{font-size:31px}p{font-size:17px}.main{padding-top:10px}}
</style></head><body><div class="app"><header class="top"><div class="brand">🛒 مختبر التجارة الإلكترونية <span class="tag">| مهارات رقمية • ثالث متوسط • ١٤٤٨هـ</span></div><div><button class="btn secondary" onclick="home()">⌂ الرئيسية</button> <button class="btn secondary" onclick="fullscreen()">⛶ ملء الشاشة</button></div></header><div class="progress"><div id="bar"></div></div><main class="main" id="main"><section class="stage" id="stage"></section></main><footer class="bottom"><button class="btn secondary" id="prev" onclick="go(page-1)">→ السابق</button><span class="count" id="counter"></span><button class="btn" id="next" onclick="go(page+1)">التالي ←</button></footer></div><script>
'use strict';let page=0,score=0,answered={},cart=[],payChoice='',safeFlags=[],teacher='',school='';const $=id=>document.getElementById(id),money=n=>n.toLocaleString('ar-SA')+' ر.س',products=[{id:1,name:'سماعة تعليمية',price:85,emoji:'🎧'},{id:2,name:'حقيبة مدرسية',price:120,emoji:'🎒'},{id:3,name:'كتاب إلكتروني',price:35,emoji:'📘'}];const scenes=14;const title=(label,t,desc='')=>`<div class="eyebrow">${label}</div><h2>${t}</h2>${desc?`<p>${desc}</p>`:''}`;function go(n){page=Math.min(scenes-1,Math.max(0,n));render()}function home(){go(0)}function fullscreen(){if(!document.fullscreenElement){document.documentElement.requestFullscreen?.().catch(()=>{});}else document.exitFullscreen?.()}function choice(id,correct,explanation){const btn=event.currentTarget,group=btn.closest('.panel');if(answered[page])return;answered[page]=true;group.querySelectorAll('.choice').forEach(x=>x.disabled=true);btn.classList.add(correct?'correct':'wrong');if(correct)score++;group.querySelector('.feedback').textContent=(correct?'✅ إجابة صحيحة! ':'💡 لنتعلم من المحاولة: ')+explanation;group.querySelectorAll('.choice').forEach(x=>{if(x.dataset.right==='1')x.classList.add('correct')});updateCounter()}function quiz(q,options,explain){return `<div class="panel"><div class="question">${q}</div><div class="choices">${options.map((o,i)=>`<button class="choice" data-right="${o[1]?1:0}" onclick="choice(${i},${o[1]},'${explain.replace(/'/g,'&#39;')}')">${o[0]}</button>`).join('')}</div><div class="feedback" aria-live="polite"></div></div>`}function addProduct(id){cart.push(id);render()}function removeProduct(index){cart.splice(index,1);render()}function selectPay(v){payChoice=v;render()}function updateCounter(){$('counter').textContent=`${page+1} / ${scenes} • نقاط التقويم: ${score}`;}function render(){let s='';switch(page){
case 0:s=`<div class="split"><div>${title('الوحدة الثالثة • التجارة الإلكترونية','افتح متجرك المعرفي!','رحلة تفاعلية عبر عالم التسوق الرقمي: نفهم التجارة الإلكترونية، نجرب الشراء، ونتعلم كيف نحمي أنفسنا على الإنترنت.')}<div class="panel"><div class="cards two"><label>اسم المعلم / المعلمة<input class="field" id="teacher" placeholder="اختياري" value="${teacher}"></label><label>اسم المدرسة<input class="field" id="school" placeholder="اختياري" value="${school}"></label></div><div class="actions"><button class="btn gold" onclick="teacher=$('teacher').value;school=$('school').value;go(1)">ابدأ الرحلة 🚀</button></div></div></div><div class="hero">🛒🌐</div></div>`;break;
case 1:s=title('خريطة الوحدة','مهمتان… ومغامرة واحدة','تغطي الأداة الدرسين المقررين مع تطبيقات صفية آمنة لا تنفذ عمليات شراء حقيقية.')+`<div class="cards two"><div class="tile"><div class="emoji">🏬</div><h3>الدرس الأول: مقدمة في التجارة الإلكترونية</h3><p>المفهوم، النماذج، المزايا والعيوب، السلع الرقمية، تجربة متجر افتراضي.</p><button class="btn" onclick="go(2)">ادخل الدرس الأول</button></div><div class="tile"><div class="emoji">🔐</div><h3>الدرس الثاني: التعاملات عبر الإنترنت</h3><p>الدفع الإلكتروني، إشارات الثقة، الاتصال الآمن، اكتشاف الاحتيال.</p><button class="btn" onclick="go(8)">ادخل الدرس الثاني</button></div></div>`;break;
case 2:s=title('الدرس الأول • المفهوم','ما التجارة الإلكترونية؟','بيع وشراء السلع أو الخدمات وتبادل البيانات والأموال باستخدام الإنترنت.')+`<div class="cards"><div class="tile"><div class="emoji">📦</div><h3>منتج مادي</h3><p>حقيبة أو سماعة تُطلب إلكترونيًا ثم تُشحن.</p></div><div class="tile"><div class="emoji">💻</div><h3>منتج رقمي</h3><p>كتاب إلكتروني أو برنامج يُسلَّم عبر الإنترنت.</p></div><div class="tile"><div class="emoji">🧾</div><h3>خدمة إلكترونية</h3><p>حجز أو خدمة تُطلب وتُدفع إلكترونيًا.</p></div></div><div class="notice">سؤال للنقاش: هل يلزم أن يكون المنتج ملموسًا حتى يُباع عبر الإنترنت؟</div>`;break;
case 3:s=title('الدرس الأول • نماذج التجارة','من يبيع؟ ومن يشتري؟','اضغط كل بطاقة لمناقشة النموذج مع الطلاب.')+`<div class="cards"><div class="tile"><div class="emoji">🏢➡️👤</div><h3>B2C</h3><p>شركة تبيع للمستهلك، مثل متجر إلكتروني يبيع حقيبة لطالب.</p></div><div class="tile"><div class="emoji">🏢↔️🏢</div><h3>B2B</h3><p>شركة تبيع لشركة أخرى، مثل مورد يبيع أجهزة لمؤسسة.</p></div><div class="tile"><div class="emoji">👤↔️👤</div><h3>C2C</h3><p>مستهلك يبيع لمستهلك آخر عبر منصة وسيطة.</p></div></div>`;break;
case 4:s=title('الدرس الأول • مقارنة','مزايا وعيوب التجارة الإلكترونية','وازن بين سهولة الشراء والتحديات المحتملة.')+`<div class="cards two"><div class="panel"><h3 style="color:var(--mint)">✓ المزايا</h3><p>التسوق في أوقات مختلفة، مقارنة الأسعار، تنوع الخيارات، قراءة تقييمات العملاء، الوصول لأسواق أوسع.</p></div><div class="panel"><h3 style="color:var(--pink)">! التحديات</h3><p>عدم فحص المنتج مباشرة، انتظار الشحن، رسوم إضافية محتملة، مخاطر الاحتيال أو تسرب البيانات.</p></div></div>`+quiz('أي مما يلي يُعد من تحديات التسوق الإلكتروني؟',[['مقارنة الأسعار بسهولة',false],['عدم القدرة على معاينة المنتج فعليًا قبل الشراء',true],['تنوع المنتجات',false],['إمكانية التسوق في أي وقت',false]],'قد تختلف السلعة عن التوقعات؛ لذا نقرأ الوصف وسياسة الإرجاع.');break;
case 5:s=title('الدرس الأول • متجر تجريبي','تسوّق بنفسك!','اختر منتجات، وأضفها إلى السلة. جميع الأسعار والطلبات محاكاة تعليمية.')+`<div class="products">${products.map(x=>`<div class="product"><div class="emoji">${x.emoji}</div><strong>${x.name}</strong><p>${money(x.price)}</p><button class="btn" onclick="addProduct(${x.id})">+ أضف للسلة</button></div>`).join('')}</div><div class="panel"><h3>🛍️ سلة المشتريات (${cart.length})</h3>${cart.length?cart.map((id,i)=>{let x=products.find(p=>p.id===id);return `<div class="rowline"><span>${x.emoji} ${x.name}</span><span>${money(x.price)} <button class="btn secondary" onclick="removeProduct(${i})">حذف</button></span></div>`}).join(''):'<p>السلة فارغة. اختر منتجًا لتبدأ.</p>'}<div class="rowline"><strong>الإجمالي</strong><strong>${money(cart.reduce((s,id)=>s+products.find(x=>x.id===id).price,0))}</strong></div><div class="actions"><button class="btn gold" onclick="go(6)" ${cart.length?'':'disabled'}>تابع إلى مراجعة الطلب ←</button></div></div>`;break;
case 6:s=title('الدرس الأول • إتمام الطلب','راجع طلبك قبل الدفع','من أهم مهارات التسوق: التحقق من الكمية والسعر وتكاليف التوصيل وسياسة الإرجاع.')+`<div class="split"><div class="receipt"><h3>🧾 فاتورة تدريبية</h3>${cart.map(id=>{let x=products.find(p=>p.id===id);return `<div class="rowline"><span>${x.name}</span><span>${money(x.price)}</span></div>`}).join('')}<div class="rowline"><span>مجموع المنتجات</span><b>${money(cart.reduce((s,id)=>s+products.find(x=>x.id===id).price,0))}</b></div><div class="rowline"><span>توصيل افتراضي</span><b>١٥ ر.س</b></div><div class="rowline"><strong>الإجمالي</strong><strong>${money(15+cart.reduce((s,id)=>s+products.find(x=>x.id===id).price,0))}</strong></div></div><div class="panel"><h3>قبل التأكيد، تحقق من:</h3><p>✓ تفاصيل المنتج والكمية</p><p>✓ السعر النهائي ورسوم التوصيل</p><p>✓ سياسة الاسترجاع والتواصل</p><div class="actions"><button class="btn" onclick="go(7)">أؤكد المراجعة (تجريبي)</button></div></div></div>`;break;
case 7:s=title('الدرس الأول • تثبيت المفهوم','هل أتقنت أساسيات التجارة الإلكترونية؟','تحدٍ قصير قبل الانتقال للتعاملات عبر الإنترنت.')+quiz('أي مثال يمثل سلعة افتراضية أو رقمية؟',[['زجاجة ماء',false],['كتاب إلكتروني قابل للتنزيل',true],['طاولة خشبية',false],['حذاء رياضي',false]],'الكتاب الإلكتروني منتج رقمي يمكن تسليمه عبر الإنترنت.')+`<div class="actions"><button class="btn gold" onclick="go(8)">الانتقال إلى الدرس الثاني 🔐</button></div>`;break;
case 8:s=title('الدرس الثاني • الدفع الإلكتروني','كيف ندفع عبر الإنترنت؟','الدفع الإلكتروني هو إتمام تحويل القيمة المالية بوسائل رقمية، وفق ضوابط الأمان.')+`<div class="cards"><div class="tile"><div class="emoji">💳</div><h3>بطاقات الدفع</h3><p>بطاقات مصرفية تستخدم في الدفع الإلكتروني لدى الجهات الموثوقة.</p></div><div class="tile"><div class="emoji">📱</div><h3>المحافظ الرقمية</h3><p>مثل Apple Pay؛ قد تستخدم المصادقة وتقنيات حماية بيانات الدفع.</p></div><div class="tile"><div class="emoji">🌍</div><h3>خدمات الدفع</h3><p>مثل PayPal، وسيط رقمي للدفع حيث تتوفر الخدمة.</p></div></div><div class="notice">لا تكتب بيانات بطاقة حقيقية في هذا الدرس؛ جميع الأنشطة محاكاة فقط.</div>`;break;
case 9:s=title('الدرس الثاني • محاكاة الدفع','اختر وسيلة دفع تجريبية','لن نطلب أي بيانات مالية حقيقية. الهدف فهم خطوات إتمام التعامل.')+`<div class="panel"><div class="choices"><button class="choice ${payChoice==='card'?'correct':''}" onclick="selectPay('card')">💳 بطاقة مصرفية</button><button class="choice ${payChoice==='wallet'?'correct':''}" onclick="selectPay('wallet')">📱 محفظة رقمية</button><button class="choice ${payChoice==='service'?'correct':''}" onclick="selectPay('service')">🌐 خدمة دفع إلكتروني</button></div>${payChoice?`<div class="notice" style="margin-top:15px">اخترت وسيلة دفع تجريبية. في التعامل الحقيقي تحقق من موثوقية المتجر، والمبلغ، ولا تشارك رمز التحقق مع أي شخص.</div><div class="actions"><button class="btn gold" onclick="document.getElementById('simResult').textContent='✅ اكتملت المحاكاة بنجاح — لم تُنفّذ أي عملية دفع.'">تأكيد المحاكاة</button></div><div id="simResult" class="feedback"></div>`:''}</div>`;break;
case 10:s=title('الدرس الثاني • الاتصال الآمن','افحص عنوان الموقع','وجود HTTPS يعني أن الاتصال مشفّر، لكنه لا يضمن وحده أن المتجر موثوق.')+`<div class="cards two"><div class="panel"><h3>مثال اتصال مشفّر</h3><div class="url">https://store.example</div><p>تحقق من اسم النطاق الصحيح، وبيانات المتجر، وسياسة الإرجاع، وآراء العملاء.</p></div><div class="panel"><h3>مثال يحتاج إلى حذر</h3><div class="url">http://shop-example.test</div><p>الاتصال غير مشفّر. لا تُدخل بيانات شخصية أو مالية في موقع غير آمن.</p></div></div>`+quiz('هل رمز القفل وHTTPS يضمنان أن المتجر ليس احتياليًا؟',[['نعم، ضمان كامل',false],['لا، يجب فحص موثوقية المتجر أيضًا',true]],'التشفير يحمي الاتصال، لكن المحتال قد يستخدم HTTPS أيضًا.');break;
case 11:s=title('الدرس الثاني • اكتشف الاحتيال','رسالة: ربحت هاتفًا مجانيًا!','وصلتك رسالة تقول: «اضغط الآن وأدخل بيانات بطاقتك خلال ٥ دقائق لاستلام جائزتك».')+`<div class="split"><div class="panel"><div class="emoji">📩🚨</div><h3>إشارات مقلقة</h3><p>وعد بجائزة غير متوقعة، استعجال شديد، طلب معلومات مالية، رابط مجهول.</p></div>${quiz('ما التصرف الصحيح؟',[['الضغط سريعًا قبل انتهاء الوقت',false],['مشاركة الرمز مع المرسل',false],['تجاهل الرابط والتحقق من الجهة عبر قنواتها الرسمية',true],['إرسال الرسالة إلى الأصدقاء ليجربوها',false]],'لا تفتح الرابط المشبوه ولا تشارك رموز التحقق.')}</div>`;break;
case 12:s=title('مشروع الوحدة • تحدي فريقك','صمّم متجرًا موثوقًا','ناقشوا العناصر التالية، ثم اضغطوا «اكشف نموذج الإجابة» للمقارنة.')+`<div class="cards"><div class="tile"><div class="emoji">🛍️</div><h3>١. ماذا نبيع؟</h3><p>اختر سلعة مادية أو رقمية، وحدد المستفيد منها.</p></div><div class="tile"><div class="emoji">💰</div><h3>٢. كيف نعرض السعر؟</h3><p>وصف واضح، سعر إجمالي، رسوم التوصيل، سياسة الاسترجاع.</p></div><div class="tile"><div class="emoji">🛡️</div><h3>٣. كيف نكسب الثقة؟</h3><p>بيانات تواصل، اتصال مشفّر، دفع موثوق، مراجعات حقيقية.</p></div></div><div class="actions"><button class="btn gold" onclick="$('projectAnswer').hidden=false">اكشف نموذج الإجابة</button></div><div class="notice" id="projectAnswer" hidden>مثال: متجر كتب رقمية يوضح سعر كل كتاب وصيغته وسياسة الاسترجاع، ويستخدم بوابة دفع موثوقة واتصال HTTPS، ولا يطلب رموز التحقق عبر الرسائل.</div>`;break;
case 13:s=title('ختام الوحدة • بطاقة خروج','أصبحت خبيرًا في التسوق الآمن!','استرجع ما تعلمته وشارك زملاءك فكرة واحدة تطبقها عند التسوق عبر الإنترنت.')+`<div class="split"><div class="panel"><div class="confetti">🏆🎉</div><h3>حصيلة رحلتك</h3><div class="big-number">${score} / ٤</div><p>النقاط من أسئلة التقويم الأربعة، ولا تُحفظ خارج جهازك.</p><div class="actions"><button class="btn gold" onclick="page=0;score=0;answered={};cart=[];payChoice='';render()">إعادة الرحلة ↻</button></div></div><div class="panel"><h3>بطاقة الخروج</h3><p>١. اذكر نموذجًا واحدًا للتجارة الإلكترونية.</p><p>٢. ما الفرق بين السلعة المادية والرقمية؟</p><p>٣. اذكر إشارتين تدعوان للحذر قبل الدفع.</p><p>٤. لماذا لا يكفي HTTPS وحده للحكم على موثوقية المتجر؟</p></div></div>`;break;
} $('stage').innerHTML=s;$('bar').style.width=((page+1)/scenes*100)+'%';$('prev').disabled=page===0;$('next').disabled=page===scenes-1;updateCounter();$('main').scrollTop=0;}document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowLeft')go(page+1);if(e.key==='ArrowRight')go(page-1)});render();
