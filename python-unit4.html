const slides=[{"title": "انطلاقة إلى عالم بايثون", "section": "مقدمة الوحدة", "desc": "تتعلم في هذه الوحدة كيف تنظم البيانات، وتستفيد من المكتبات، وتصمم واجهات رسومية، وتحفظ المعلومات في ملفات.", "kind": "intro"}, {"title": "هياكل البيانات", "section": "القوائم وصفوف البيانات", "desc": "هي طرق لتنظيم البيانات وتخزينها؛ منها البسيطة مثل الأعداد والنصوص، وغير البسيطة مثل القوائم والقواميس.", "kind": "concept"}, {"title": "أنشئ قائمة", "section": "القوائم وصفوف البيانات", "desc": "القائمة تجمع عناصر مرتبة بين قوسين مربعين، ويمكن تغيير عناصرها وإضافة عناصر جديدة.", "kind": "list"}, {"title": "الوصول إلى عناصر القائمة", "section": "القوائم وصفوف البيانات", "desc": "يبدأ فهرس عناصر القائمة من الصفر؛ العنصر الأول رقمه 0 والثاني رقمه 1.", "kind": "index"}, {"title": "إضافة وحذف العناصر", "section": "القوائم وصفوف البيانات", "desc": "تضيف append عنصرًا في نهاية القائمة، وتحذف pop عنصرًا من القائمة.", "kind": "append"}, {"title": "صفوف البيانات Tuple", "section": "القوائم وصفوف البيانات", "desc": "صف البيانات يشبه القائمة، لكنه غير قابل لتعديل عناصره بعد إنشائه، ويُكتب عادة بين قوسين دائريين.", "kind": "tuple"}, {"title": "اختبر فهمك: القوائم", "section": "القوائم وصفوف البيانات", "desc": "ما رقم فهرس أول عنصر في قائمة بايثون؟", "kind": "quiz:0|1|2|0"}, {"title": "لماذا نستخدم المكتبات؟", "section": "المكتبات البرمجية", "desc": "المكتبة مجموعة تعليمات برمجية جاهزة نعيد استخدامها لتوفير الوقت والجهد.", "kind": "concept"}, {"title": "المكتبات القياسية", "section": "المكتبات البرمجية", "desc": "تضم بايثون مكتبات جاهزة، مثل math للحسابات وrandom للاختيار العشوائي.", "kind": "library"}, {"title": "جرّب دوال الرياضيات", "section": "المكتبات البرمجية", "desc": "استخدم دالة الجذر التربيعي من مكتبة math لحساب جذر عدد.", "kind": "sqrt"}, {"title": "الاختيار العشوائي", "section": "المكتبات البرمجية", "desc": "يمكن اختيار قيمة عشوائية من مجموعة قيم باستخدام random.choice.", "kind": "random"}, {"title": "مدير الحزم pip", "section": "المكتبات البرمجية", "desc": "يُستخدم pip لتثبيت مكتبات إ ": "القوائم المتداخلة", "desc": "استخدم فهرسين متتاليين: الأول لاختيار القائمة الداخلية، والثاني لاختيار عنصر منها.", "kind": "nestedget"}, {"title": "تحدي درجات الطلاب", "section": "القوائم المتداخلة", "desc": "تأمل الجدول، ثم اختر الصف والعمود لعرض الدرجة المقابلة.", "kind": "matrix"}, {"title": "لماذا نستخدم الملفات؟", "section": "الملفات", "desc": "تُفقد البيانات الموجودة في ذاكرة التشغيل عند إغلاق البرنامج، بينما تبقى البيانات المحفوظة في الملفات.", "kind": "concept"}, {"title": "فتح ملف نصي", "section": "الملفات", "desc": "تستخدم open لفتح الملف، مع تحديد نمط مثل r للقراءة أو w للكتابة أو a للإلحاق.", "kind": "file"}, {"title": "الكتابة والقراءة", "section": "الملفات", "desc": "يمكن كتابة نص إلى ملف وقراءته لاحقًا. هذا المثال يحاكي ملفًا نصيًا داخل الدرس دون الوصول إلى ملفات جهازك.", "kind": "filedemo"}, {"title": "مشروع الوحدة: حساب الدرجات", "section": "مشروع الوحدة", "desc": "أنشئ قوائم درجات للرياضيات والعلوم والدراسات الاجتماعية، ثم احسب المتوسط وحدد المادة الأعلى.", "kind": "project"}, {"title": "تحدي الختام", "section": "التقويم النهائي", "desc": "أكملت رحلة البرمجة مع بايثون. اختبر مهاراتك ثم جرّب كتابة البرامج على بيئة بايثون حقيقية.", "kind": "final"}];
const groups=[...new Set(slides.map(x=>x.section))];let page=(()=>{try{let n=Number(localStorage.getItem('python_unit_slide'));return Number.isInteger(n)&&n>=0&&n<slides.length?n:0}catch{return 0}})();
const $=id=>document.getElementById(id);const code=(s)=>'<pre>'+s.replaceAll('&','&amp;').replaceAll('<','&lt;')+'</pre>';const btn=(label,fn)=>'<button class="action" onclick="'+fn+'">'+label+'</button>';const out='<output id="out">اضغط على الزر لتجربة المثال</output>';
function demo(s){let k=s.kind, t='';switch(k){
case 'intro':t='<div class="visual"><span>💻</span></div><p>ستتعلم كتابة أوامر بايثون خطوة بخطوة، مع محاكاة النتائج داخل هذه الصفحة.</p>';break;
case 'concept':t=`<div class="tree"><div class="tree-root">هياكل البيانات <small>Data Structures</small></div><div class="tree-branches"><div class="tree-branch"><div class="tree-head">هياكل بيانات بسيطة <small>Primitive</small></div><div class="tree-leaves"><div>الأعداد الصحيحة <small>Integer</small></div><div>الأعداد الحقيقية <small>Real</small></div><div>النصوص / الأحرف <small>Character</small></div><div>القيم المنطقية <small>Boolean</small></div></div></div><div class="tree-branch"><div class="tree-head">هياكل بيانات غير بسيطة <small>Non-primitive</small></div><div class="tree-subbranches"><div><div class="tree-subhead">خطية <small>Linear</small></div><div class="tree-leaves"><div>القائمة <small>List</small></div><div>المصفوفة <small>Array</small></div><div>المجموعة <small>Set</small></div><div>صف البيانات <small>Tuple</small></div><div>القاموس <small>Dictionary</small></div></div></div><div><div class="tree-subhead">غير خطية <small>Non-linear</small></div><div class="tree-leaves"><div>الشجرة <small>Tree</small></div><div>المخطط <small>Graph</small></div><div>الملف <small>File</small></div></div></div></div></div></div></div><p class="hint">الهياكل البسيطة تخزن قيمًا مفردة، أما غير البسيطة فتنظم مجموعات من القيم. الخطية تتتابع عناصرها، وغير الخطية لا تشترط ترتيبًا تسلسليًا.</p>`;break;
case 'list':t=code('fruits = ["apple", "orange", "banana"]\nprint(fruits)')+btn('شغّل المثال','showResult(`[\'apple\', \'orange\', \'banana\']`)')+out;break;
case 'index':t=code('fruits = ["apple", "orange", "banana"]\nprint(fruits[1])')+'<div class="grid"><div class="tile">0<br>apple</div><div class="tile">1<br>orange</div><div class="tile">2<br>banana</div></div>'+btn('اعرض العنصر 1','showResult("orange")')+out;break;

case 'random':t=code('import random\nprint(random.choice(["أحمر", "أزرق", "أخضر"]))')+btn('اختر لونًا عشوائيًا','showResult(["أحمر","أزرق","أخضر"][Math.floor(Math.random()*3)])')+out;break;

const detailedExplanations={"list":{"title":"القوسان المربعان [ ]","sample":"fruits = [\"apple\", \"orange\", \"banana\"]","description":"القوس [ يفتح القائمة، والقوس ] يغلقها، والفاصلة , تفصل العناصر. علامة = تخزن القائمة في المتغير fruits. يمكنك تغيير العناصر بعد إنشائها.","parts":["[","apple , orange , banana","]"]},"index":{"title":"القوسان المربعان للوصول إلى عنصر","sample":"fruits = [\"apple\", \"orange\", \"banana\"]\nprint(fruits[0])  # apple\nprint(fruits[2])  # banana\nprint(fruits[-1]) # banana","description":"نكتب اسم القائمة ثم [رقم الفهرس]. يبدأ العد من 0، والفهرس -1 يعني آخر عنصر. القوسان هنا لا ينشئان قائمة جديدة؛ بل يحددان العنصر المطلوب.","parts":["fruits[","0","]"]},"append":{"title":"إضافة عنصر وحذفه","sample":"numbers = [10, 20]\nnumbers.append(30)\nprint(numbers) # [10, 20, 30]\nnumbers.pop()\nprint(numbers) # [10, 20]","description":"النقطة . تستدعي عملية من عمليات القائمة. الأقواس الدائرية ( ) بعد append تحتوي العنصر الجديد. أما pop() دون رقم فتحذف العنصر الأخير.","parts":[]},"tuple":{"title":"الصف البياني: أقواس دائرية ( )","sample":"colors = (\"red\", \"green\", \"blue\")\nprint(colors[1]) # green","description":"يُنشأ الصف بين ( ) وتُفصل عناصره بفواصل. الصف لا يسمح بتغيير عناصره بعد إنشائه، لكن قراءة عنصر منه تستخدم الأقواس المربعة [ ] مثل القائمة.","parts":["(","red , green , blue",")"]},"library":{"title":"استيراد نموذج برمجي","sample":"import math\nprint(math.floor(3.8)) # 3","description":"الكلمة import تستورد النموذج math، والنقطة . تتيح استخدام دالته floor. الأقواس (3.8) تمرر العدد إلى الدالة.","parts":[]},"sqrt":{"title":"تمرير قيمة إلى دالة","sample":"import math\nprint(math.sqrt(81)) # 9.0","description":"الأقواس الدائرية ( ) تحتوي مُدخل الدالة. sqrt(81) تعني حساب الجذر التربيعي للعدد 81. وتُكتب النتيجة داخل print() لعرضها.","parts":[]},"random":{"title":"اختيار عنصر من قائمة","sample":"import random\ncolors = [\"red\", \"blue\", \"green\"]\nprint(random.choice(colors))","description":"القوسان [ ] يجمعان الخيارات في قائمة، بينما الأقواس ( ) في choice(colors) تحدد القائمة التي ستختار منها الدالة عنصرًا عشوائيًا.","parts":[]},"pip":{"title":"الفرق بين الأمر البرمجي وأمر التثبيت","sample":"python -m pip install pygame","description":"يُكتب هذا الأمر في الطرفية Terminal، وليس داخل ملف أوامر بايثون. وهو يطلب تثبيت حزمة pygame في بيئة بايثون المناسبة.","parts":[]},"gui":{"title":"إنشاء نافذة رسومية","sample":"from tkinter import *\nwindow = Tk()\nwindow.title(\"نافذتي\")\nwindow.mainloop()","description":"Tk() تنشئ النافذة. الأقواس ( ) في title(\"نافذتي\") تمرر نص عنوان النافذة. mainloop() تبقي النافذة قيد التشغيل وتستقبل الأحداث.","parts":[]},"canvas":{"title":"إنشاء لوحة رسم","sample":"canvas = Canvas(window, width=400, height=300, bg=\"white\")\ncanvas.pack()","description":"Canvas() ينشئ مساحة للرسم؛ width وheight يحددان الأبعاد، وbg لون الخلفية. الدالة pack() تعرض اللوحة داخل النافذة.","parts":[]},"coords":{"title":"قراءة الإحداثيات (x, y)","sample":"canvas.create_line(20, 30, 180, 100)","description":"كل نقطتين متتاليتين تمثلان (x, y). يبدأ المحور x من اليسار إلى اليمين، والمحور y من الأعلى إلى الأسفل. هنا يبدأ الخط عند (20,30) وينتهي عند (180,100).","parts":[]},"shapes":{"title":"الأقواس وترتيب قيم الرسم","sample":"canvas.create_rectangle(40, 40, 180, 130, fill=\"teal\")","description":"الأرقام الأربعة داخل ( ) تحدد ركني المستطيل: x1 وy1 ثم x2 وy2. الفواصل تفصل القيم، وfill يحدد لون التعبئة.","parts":[]},"events":{"title":"ربط حدث باستجابة","sample":"canvas.bind(\"<Button-1>\", on_click)","description":"bind() تربط الحدث بدالة. الرمز <Button-1> يشير إلى نقرة زر الفأرة الأيسر. اسم الدالة on_click يُكتب دون أقواس لأنها تُستدعى عند وقوع الحدث.","parts":[]},"dict":{"title":"القاموس: أقواس معقوفة { }","sample":"student = {\"name\": \"Ali\", \"score\": 95}\nprint(student)","description":"القوس { يفتح القاموس و} يغلقه. كل عنصر يتكون من مفتاح : قيمة، وتفصل الفاصلة , بين الأزواج. في المثال المفتاح name مرتبط بالنص Ali.","parts":["{","\"name\": \"Ali\", \"score\": 95","}"]},"dictget":{"title":"الوصول بالمفتاح لا برقم الفهرس","sample":"student = {\"name\": \"Ali\", \"score\": 95}\nprint(student[\"score\"]) # 95","description":"القاموس يُنشأ بالأقواس المعقوفة { }، لكن الوصول إلى قيمة يستخدم [\"اسم المفتاح\"]. هنا لا نكتب [0] للوصول إلى أول عنصر.","parts":[]},"dictedit":{"title":"تعديل قيمة أو إضافة مفتاح","sample":"student = {\"name\": \"Ali\", \"score\": 95}\nstudent[\"score\"] = 100\nstudent[\"class\"] = \"3A\"\ndel student[\"name\"]","description":"القوسان [ ] يحددان المفتاح المطلوب تعديله أو إضافته. التعليمة del تحذف المفتاح وقيمته من القاموس.","parts":[]},"nested":{"title":"قائمة داخل قائمة","sample":"grades = [[90, 85], [70, 95]]","description":"الأقواس المربعة الخارجية [ ] تحتوي قائمتين داخليتين، وكل قائمة داخلية محاطة أيضًا بـ [ ]. الفاصلة بين القائمتين تفصل الصفوف.","parts":["[","[90, 85] , [70, 95]","]"]},"nestedget":{"title":"فهرسان للوصول إلى عنصر داخلي","sample":"grades = [[90, 85], [70, 95]]\nprint(grades[1][0]) # 70","description":"القوس الأول [1] يختار القائمة الداخلية الثانية، ثم القوس الثاني [0] يختار أول عنصر فيها. يبدأ كلا الفهرسين من الصفر.","parts":[]},"matrix":{"title":"صف ثم عمود","sample":"grades = [[90, 85], [70, 95], [88, 92]]\nprint(grades[2][1]) # 92","description":"تخيّل القائمة الخارجية جدولًا: الرقم في القوس الأول يحدد الصف، والرقم في القوس الثاني يحدد العمود. grades[2][1] تعني الصف الثالث والعمود الثاني.","parts":[]},"file":{"title":"فتح ملف: الاسم والنمط بين أقواس","sample":"f = open(\"notes.txt\", \"w\", encoding=\"utf-8\")\nf.write(\"مرحبًا\")\nf.close()","description":"open() تستقبل اسم الملف بين علامتي اقتباس، ثم نمط الفتح. r للقراءة، w للكتابة مع استبدال المحتوى السابق، a للإضافة في نهاية الملف. close() تغلق الملف.","parts":[]},"filedemo":{"title":"الفرق بين الكتابة والقراءة والإلحاق","sample":"with open(\"notes.txt\", \"a\", encoding=\"utf-8\") as f:\n    f.write(\"\\nسطر جديد\")\nwith open(\"notes.txt\", \"r\", encoding=\"utf-8\") as f:\n    print(f.read())","description":"الأقواس في open() تحدد اسم الملف ونمطه. الدالة write() تكتب نصًا، وread() تقرأه. استخدام with يغلق الملف تلقائيًا بعد انتهاء الكتلة.","parts":[]},"project":{"title":"فهم بناء القوائم والدوال","sample":"scores = [90, 80, 95]\nprint(sum(scores)) # 265\nprint(len(scores)) # 3\nprint(sum(scores) / len(scores)) # 88.333...","description":"[ ] تنشئ قائمة الدرجات، و( ) تمرر القائمة إلى الدالتين sum وlen. القسمة / تحسب المتوسط.","parts":[]},"concept":{"title":"أمثلة توضح نوع البيانات","sample":"age = 15\nprice = 3.14\nname = \"Ali\"\npassed = True\nfruits = [\"apple\", \"banana\"]","description":"الأعداد والنصوص والقيم المنطقية أمثلة لهياكل بسيطة. أما القائمة [ ] فتجمع أكثر من قيمة. المخطط الشجري يبين تصنيف الأنواع.","parts":[]}};
function explainStructure(s){let d=detailedExplanations[s.kind];if(!d)return '';let parts=d.parts?.length===3?'<div class="syntax-visual" dir="ltr"><span class="syntax-bracket">'+escapeText(d.parts[0])+'</span><span>'+escapeText(d.parts[1])+'</span><span class="syntax-bracket">'+escapeText(d.parts[2])+'</span></div>':'';return '<section class="explain"><h3>🔎 '+escapeText(d.title)+'</h3>'+parts+'<p>'+escapeText(d.description)+'</p>'+code(d.sample)+'</section>'}
function escapeText(x){return String(x).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function render(){let s=slides[page];$('slide').innerHTML='<span class="tag">'+s.section+'</span><h2>'+s.title+'</h2><p class="lead">'+s.desc+'</p>'+explainStructure(s)+'<div class="demo"><h3>🧪 جرّب بنفسك</h3>'+demo(s)+'</div>';$('counter').textContent=(page+1)+' / '+slides.length;$('bar').style.width=((page+1)/slides.length*100)+'%';$('prev').disabled=page===0;$('next').disabled=page===slides.length-1;$('tabs').innerHTML=groups.map(g=>'<button class="'+(g===s.section?'active':'')+'" onclick="go('+slides.findIndex(x=>x.section===g)+')">'+g+'</button>').join('');try{localStorage.setItem('python_unit_slide',page)}catch{}if(s.kind==='coords')drawPoint();}
function go(n){page=Math.min(slides.length-1,Math.max(0,n));render();window.scrollTo({top:0,behavior:'instant'})}function showResult(x){$('out').textContent='النتيجة: '+x}function quiz(n,correct){showResult(n===correct?'✅ إجابة صحيحة!':'❌ حاول مرة أخرى')}function drawPoint(){let c=$('cv');if(!c)return;let ctx=c.getContext('2d'),x=+$('x').value,y=+$('y').value;ctx.clearRect(0,0,310,170);ctx.strokeStyle='#aacbd1';ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(310,0);ctx.moveTo(0,0);ctx.lineTo(0,170);ctx.stroke();ctx.fillStyle='#238c8b';ctx.beginPath();ctx.arc(x,y,9,0,7);ctx.fill();showResult('x = '+x+' ، y = '+y)}function drawShape(type){let c=$('cv').getContext('2d');c.clearRect(0,0,310,170);c.fillStyle='#238c8b';if(type==='rect')c.fillRect(40,40,180,90);else{c.beginPath();c.arc(150,85,55,0,7);c.fill()}}function saveText(){try{localStorage.setItem('python_demo_file',$('fileText').value);showResult('تم الحفظ داخل المحاكاة')}catch{showResult('الحفظ غير متاح في هذا المتصفح')}}function readText(){showResult(localStorage.getItem('python_demo_file')??'لا يوجد نص محفوظ')}function calcProject(){let names=['الرياضيات','العلوم','الدراسات الاجتماعية'],ids=['math','science','social'];let arr=ids.map(id=>$(id).value.split(',').map(Number));if(arr.some(a=>a.length!==3||a.some(n=>!Number.isFinite(n)||n<0||n>100))){showResult('أدخل ثلاث درجات صحيحة من 0 إلى 100 لكل مادة');return}let av=arr.map(a=>a.reduce((x,y)=>x+y,0)/a.length),top=av.indexOf(Math.max(...av)),count=arr.flat().filter(x=>x===19).length;showResult('متوسط جميع الدرجات: '+(arr.flat().reduce((a,b)=>a+b,0)/9).toFixed(1)+' | أعلى متوسط: '+names[top]+' ('+av[top].toFixed(1)+') | تكرار الدرجة 19: '+count)}$('prev').onclick=()=>go(page-1);$('next').onclick=()=>go(page+1);render();
</script></body></html>
