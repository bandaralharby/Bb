const bookAdditions=[{"title":"إنشاء القوائم وطباعتها","section":"القوائم وصفوف البيانات","desc":"القائمة هيكل بيانات خطي مرتب، تقبل أرقامًا ونصوصًا وعناصر من أنواع مختلفة، وتُكتب عناصرها بين [ ] مفصولة بفواصل.","kind":"book","example":"nums = [1, 132, 358, 14.5, 7.13]\nfruits = [\"apple\", \"orange\", \"banana\"]\nprint(nums)\nprint(fruits)","explain":"الأقواس المربعة [ ] لإنشاء القائمة، والفاصلة , للفصل بين العناصر. يمكن المرور على العناصر باستخدام for.","source":"١٣٤–١٣٥"},{"title":"الفهرسة الموجبة والسالبة","section":"القوائم وصفوف البيانات","desc":"تبدأ الفهرسة من الصفر. ويمكن استخدام فهرس سالب للعد من نهاية القائمة.","kind":"book","example":"fruits = [\"apple\", \"orange\", \"banana\"]\nprint(fruits[2])  # banana\nprint(fruits[-1]) # banana\nprint(fruits[-2]) # orange","explain":"القوسان [ ] بعد اسم القائمة للوصول إلى عنصر؛ [0] للأول، [1] للثاني، و[-1] للأخير.","source":"١٣٥–١٣٦"},{"title":"تعديل عنصر في القائمة","section":"القوائم وصفوف البيانات","desc":"القوائم قابلة للتغيير، لذا يمكن استبدال قيمة عنصر موجود باستخدام فهرسه.","kind":"book","example":"fruits = [\"apple\", \"orange\", \"banana\"]\nfruits[1] = \"grape\"\nprint(fruits)  # [\"apple\", \"grape\", \"banana\"]","explain":"تحدد [1] العنصر الثاني ثم تستبدل قيمته. هذا يختلف عن الصف البياني الذي لا يقبل التعديل.","source":"١٣٦"},{"title":"دالة len()","section":"القوائم وصفوف البيانات","desc":"تعيد عدد عناصر القائمة. وهي دالة مدمجة تُكتب حول اسم القائمة بأقواس دائرية.","kind":"book","example":"grades = [89, 88, 98, 95]\nprint(len(grades)) # 4","explain":"تُمرر القائمة إلى len(grades) فتحسب العناصر الأربعة، وليس مجموع الدرجات.","source":"١٣٧"},{"title":"دالة sum()","section":"القوائم وصفوف البيانات","desc":"تحسب مجموع عناصر القائمة العددية.","kind":"book","example":"grades = [89, 88, 98, 95]\nprint(sum(grades)) # 370","explain":"sum() للجمع، ولا تصلح لجمع قائمة تحتوي على نصوص وأعداد مختلطة.","source":"١٣٧"},{"title":"دالتا max() وmin()","section":"القوائم وصفوف البيانات","desc":"تعيد max() أكبر قيمة، وتعيد min() أصغر قيمة من القائمة.","kind":"book","example":"grades = [89, 88, 98, 95]\nprint(max(grades)) # 98\nprint(min(grades)) # 88","explain":"يمكن تطبيق min على قائمة حروف قابلة للمقارنة مثل [\"b\",\"a\",\"x\"] فتعيد \"a\". لا تخلط أرقامًا ونصوصًا في المقارنة.","source":"١٣٨"},{"title":"إنشاء قائمة فارغة ثم إضافة العناصر","section":"القوائم وصفوف البيانات","desc":"تبدأ بقائمة فارغة [ ] ثم تستقبل عناصر جديدة باستخدام append().","kind":"book","example":"subjects = []\nfor i in range(3):\n    subject = input(\"Subject: \")\n    subjects.append(subject)\nprint(subjects)","explain":"append(x) تضيف x في نهاية القائمة. لاحظ الأقواس المربعة للقائمة والدائرية لاستدعاء الدالة.","source":"١٣٩"},{"title":"الدالة remove(x): حذف بالقيمة","section":"القوائم وصفوف البيانات","desc":"تحذف أول ظهور للعنصر الذي تساوي قيمته x، وليس العنصر الموجود في الفهرس x.","kind":"book","example":"grades = [89, 88, 98, 95]\ngrades.append(100)\ngrades.remove(88)\nprint(grades) # [89, 98, 95, 100]","explain":"remove(88) تبحث عن القيمة 88 وتحذفها. إذا لم توجد القيمة يحدث خطأ ValueError. هذا هو الحذف المعروض في الكتاب.","source":"١٣٩–١٤٠"},{"title":"الدالة count(x): عدّ التكرارات","section":"القوائم وصفوف البيانات","desc":"تعيد عدد مرات ظهور قيمة معينة داخل القائمة.","kind":"book","example":"grades = [89, 88, 98, 95]\ngrades.append(88)\nprint(grades.count(88)) # 2","explain":"القيمة 88 ظهرت مرتين؛ لا تحذف الدالة شيئًا، بل تعيد العدد فقط.","source":"١٣٩–١٤٠"},{"title":"الدالة sort(): ترتيب تصاعدي","section":"القوائم وصفوف البيانات","desc":"ترتب عناصر القائمة نفسها تصاعديًا.","kind":"book","example":"grades = [89, 98, 95, 100]\ngrades.sort()\nprint(grades) # [89, 95, 98, 100]","explain":"sort() تغير ترتيب القائمة الأصلية؛ الأقواس فارغة لأننا لم نمرر وسيطًا.","source":"١٣٩–١٤٠"},{"title":"الدالة reverse(): عكس الترتيب","section":"القوائم وصفوف البيانات","desc":"تعكس الترتيب الحالي للعناصر، ولا ترتبها تصاعديًا أو تنازليًا بحسب القيمة.","kind":"book","example":"grades = [89, 98, 95, 100]\ngrades.reverse()\nprint(grades) # [100, 95, 98, 89]","explain":"الفرق مهم: reverse() تقلب ترتيب العناصر الحالي، أما sort() فترتبها بحسب القيمة.","source":"١٣٩–١٤٠"},{"title":"الدالة clear(): إفراغ القائمة","section":"القوائم وصفوف البيانات","desc":"تحذف جميع العناصر من القائمة مع بقاء القائمة نفسها.","kind":"book","example":"grades = [89, 98, 95, 100]\ngrades.clear()\nprint(grades) # []","explain":"بعد clear() تصبح القائمة فارغة [ ]، بخلاف remove(x) التي تحذف قيمة محددة.","source":"١٣٩–١٤١"},{"title":"تدريب الدوال: قائمة المشتريات","section":"القوائم وصفوف البيانات","desc":"طبّق دالتي الحذف وعد العناصر على المثال الوارد في الكتاب.","kind":"book","example":"groceryList = [\"salad\", \"fruits\", \"vegetables\", \"dairy\"]\ngroceryList.remove(\"dairy\")\nprint(len(groceryList)) # 3","explain":"لإزالة dairy نستخدم remove(\"dairy\")، ولعرض عدد العناصر المتبقية نستخدم len(groceryList).","source":"١٤١"},{"title":"صفوف البيانات: عدم قابلية التعديل","section":"القوائم وصفوف البيانات","desc":"الصف Tuple مرتب لكنه غير قابل لتغيير عناصره بعد إنشائه.","kind":"book","example":"personalInfo = (\"Khaled\", \"khaled@edu.sa\", 1234)\nprint(personalInfo[0])\n# personalInfo[0] = \"Saad\"  # TypeError","explain":"يُنشأ الصف بالأقواس ( )، ويُقرأ عنصره بالأقواس [ ]. محاولة تغيير العنصر تُنتج خطأ TypeError.","source":"١٤٢–١٤٤"},{"title":"المكتبات والنماذج البرمجية","section":"المكتبات البرمجية","desc":"تضم مكتبة بايثون القياسية نماذج جاهزة ودوال يمكن إعادة استخدامها بدل كتابة كل وظيفة من الصفر.","kind":"book","example":"import math\nprint(math.sqrt(81))\nfrom math import floor\nprint(floor(3.8))","explain":"import لاستيراد النموذج كاملًا، وfrom ... import لاستيراد دالة محددة. تشرح صفحات الكتاب الفرق بين المكتبة والنموذج والدالة.","source":"١٤٨–١٥٤"},{"title":"نماذج النظام والرياضيات والوقت","section":"المكتبات البرمجية","desc":"يقدم الكتاب نماذج مثل sys وos وmath وtime وdatetime وtkinter، ويعرض أمثلة لاستدعاء دوالها.","kind":"book","example":"import sys\nimport os\nimport math\nimport datetime\nprint(sys.platform)\nprint(os.getcwd())\nprint(math.pi)\nprint(datetime.date.today())","explain":"sys لمعلومات النظام، وos للتعامل مع بيئة التشغيل، وmath للرياضيات، وdatetime للتاريخ. قد تختلف النتائج بحسب الجهاز.","source":"١٥٤–١٦٢"},{"title":"الزوايا والدوال الرياضية","section":"المكتبات البرمجية","desc":"تستخدم دوال sin وcos وtan قياس الزاوية بالتقدير الدائري، وليس الدرجات مباشرة.","kind":"book","example":"import math\nangle = math.radians(60)\nprint(math.sin(angle))\nprint(math.cos(angle))","explain":"تحول radians(60) الستين درجة إلى راديان قبل تمريرها إلى الدوال المثلثية.","source":"١٥٨–١٥٩"},{"title":"مكتبة pygame وإنشاء الشاشة","section":"المكتبات البرمجية","desc":"يشرح الكتاب تثبيت pygame وتهيئتها وإنشاء نافذة وتحديد الألوان وأبعاد الشاشة.","kind":"book","example":"import pygame\npygame.init()\nscreen = pygame.display.set_mode((500, 400))\npygame.display.set_caption(\"My screen\")","explain":"تحتاج pygame إلى تثبيت منفصل في بيئة بايثون. الزوج (500, 400) يمثل العرض والارتفاع، والألوان قد تُمثل بقيم RGB.","source":"١٦٣–١٦٨"},{"title":"تكينتر: الألوان ولوحة الرسم","section":"بناء الواجهات الرسومية بلغة البايثون","desc":"يمكن تحديد الألوان بأسمائها أو قيمها، وتُنشأ لوحة Canvas لرسم الأشكال.","kind":"book","example":"from tkinter import *\nwindow = Tk()\ncanvas = Canvas(window, bg=\"teal\", width=600, height=200)\ncanvas.pack()\nwindow.mainloop()","explain":"تحدد bg لون الخلفية، وwidth العرض، وheight الارتفاع. pack() تعرض اللوحة في النافذة.","source":"١٧١–١٧٤"},{"title":"الأحداث والتفاعل مع الفأرة","section":"بناء الواجهات الرسومية بلغة البايثون","desc":"يربط bind الحدث بدالة تستجيب للنقر أو حركة مؤشر الفأرة.","kind":"book","example":"def callback(event):\n    print(event.x, event.y)\ncanvas.bind(\"<Button-1>\", callback)","explain":"<Button-1> لنقرة الفأرة اليسرى. يمرر الحدث إحداثيات النقر، ويُكتب اسم callback دون أقواس عند الربط.","source":"١٧٥–١٧٦"},{"title":"رسم الخط والمثلث والمستطيل والبيضاوي","section":"بناء الواجهات الرسومية بلغة البايثون","desc":"يعرض الكتاب دوال الرسم باستخدام إحداثيات النقاط على لوحة Canvas.","kind":"book","example":"canvas.create_line(20, 30, 180, 100)\ncanvas.create_polygon(20, 120, 80, 30, 140, 120)\ncanvas.create_rectangle(180, 30, 280, 120)\ncanvas.create_oval(300, 30, 420, 120)","explain":"تُقرأ الإحداثيات في أزواج x,y. يبدأ المحور الرأسي من أعلى اللوحة ويتجه للأسفل.","source":"١٧٣–١٨٠"},{"title":"إنشاء القاموس بطريقتين","section":"القواميس","desc":"ينشأ القاموس إما بأقواس { } مع أزواج مفتاح:قيمة، أو باستخدام dict().","kind":"book","example":"gulf = {\"Oman\": \"Muscat\", \"Bahrain\": \"Manama\"}\nother = dict(Oman=\"Muscat\", Bahrain=\"Manama\")\nprint(gulf)","explain":"كل مفتاح فريد؛ لا يمكن استخدام رقم فهرس للوصول إلى عنصر كما في القائمة.","source":"١٨٤–١٨٦"},{"title":"الوصول إلى قيم القاموس","section":"القواميس","desc":"تصل إلى القيمة إما باستخدام المفتاح بين [ ] أو باستخدام get().","kind":"book","example":"gulf = {\"Oman\": \"Muscat\", \"Bahrain\": \"Manama\"}\nprint(gulf[\"Oman\"])\nprint(gulf.get(\"Bahrain\"))","explain":"المفتاح وليس رقم الموقع هو وسيلة الوصول. get() تعيد None عند غياب المفتاح افتراضيًا، بينما [ ] قد تثير KeyError.","source":"١٨٧"},{"title":"تحديث القاموس وإظهار مفاتيحه وقيمه","section":"القواميس","desc":"يمكن تعديل القيم وإضافة أزواج جديدة باستخدام update()، وعرض المفاتيح والقيم باستخدام keys() وvalues().","kind":"book","example":"students = {\"Khalid\": 154327, \"Saad\": 154876}\nstudents.update({\"Ahmed\": 174527})\nstudents.update({\"Saad\": 154651})\nprint(students.keys())\nprint(students.values())","explain":"update() تضيف مفتاحًا جديدًا أو تغير قيمة مفتاح موجود. keys() للمفاتيح وvalues() للقيم.","source":"١٨٨–١٨٩"},{"title":"حذف عناصر القاموس","section":"القواميس","desc":"يمكن حذف زوج معين باستخدام del، أو حذف جميع العناصر باستخدام clear().","kind":"book","example":"gulf = {\"Oman\": \"Muscat\", \"Bahrain\": \"Manama\"}\ndel gulf[\"Oman\"]\nprint(gulf)\ngulf.clear()\nprint(gulf) # {}","explain":"del gulf[\"Oman\"] تحذف المفتاح وقيمته، وclear() تفرغ القاموس مع بقائه.","source":"١٩٠–١٩١"},{"title":"قوائم متداخلة من أنواع مختلفة","section":"القوائم المتداخلة","desc":"يمكن أن تضم القائمة قائمة داخلية إلى جانب عناصر أخرى مثل النصوص والأعداد.","kind":"book","example":"data = [3, [ \"a\", \"b\", \"c\" ], 7.5, -2, \"orange\"]\nprint(data[1])","explain":"الأقواس المربعة الخارجية تجمع عناصر القائمة الرئيسية، والداخلية تجمع عناصر قائمة فرعية.","source":"١٩٥–١٩٦"},{"title":"التكرارات المتداخلة","section":"القوائم المتداخلة","desc":"يمكن المرور على القوائم الداخلية باستخدام حلقتين متداخلتين.","kind":"book","example":"data = [[1, 2], [\"c\", \"d\"]]\nfor row in data:\n    for item in row:\n        print(item)","explain":"الحلقة الخارجية تمر على القوائم الفرعية، والداخلية تمر على عناصر كل قائمة.","source":"١٩٧–١٩٨"},{"title":"أنماط فتح الملفات","section":"الملفات","desc":"تستخدم open() اسم الملف ونمط التشغيل: r للقراءة، وw للكتابة مع استبدال المحتوى، وa للإلحاق، وr+ للقراءة والكتابة في ملف موجود.","kind":"book","example":"f = open(\"file.txt\", \"r\")\ntext = f.read()\nf.close()","explain":"يجب وجود الملف عند استخدام r أو r+. ينشئ w وa ملفًا إذا لم يكن موجودًا. أغلق الملف بعد الانتهاء.","source":"٢٠١–٢٠٣"},{"title":"قراءة ملف سطرًا بسطر","section":"الملفات","desc":"تقرأ readline() سطرًا واحدًا في كل استدعاء، بينما تقرأ readlines() جميع الأسطر في قائمة.","kind":"book","example":"f = open(\"file.txt\", \"r\")\nprint(f.readline())\nprint(f.readlines())\nf.close()","explain":"يُبقي الحرف \\n على نهاية السطر غالبًا، ويمكن استخدام replace(\"\\n\", \"\") لإزالته عند تخزين أسماء المدن.","source":"٢٠٤، ٢٠٧–٢٠٨"},{"title":"الفرق بين الإلحاق والكتابة","section":"الملفات","desc":"النمط a يضيف في نهاية الملف، أما w فيستبدل المحتوى السابق.","kind":"book","example":"f = open(\"cities.txt\", \"w\")\nf.write(\"Riyadh\\n\")\nf.close()\nf = open(\"cities.txt\", \"a\")\nf.write(\"Jeddah\\n\")\nf.close()","explain":"\\n ينشئ سطرًا جديدًا. لا تستخدم w لإضافة بيانات إلى ملف تريد الاحتفاظ بمحتواه القديم.","source":"٢٠٥–٢٠٦"},{"title":"ملف المدن وقائمة الأسطر","section":"الملفات","desc":"يمكن تحويل الأسطر المقروءة من ملف إلى عناصر قائمة، ثم إزالة محارف الانتقال للسطر.","kind":"book","example":"cities = []\nf = open(\"cities.txt\", \"r\")\nfor line in f:\n    cities.append(line.replace(\"\\n\", \"\"))\nf.close()\nprint(cities)","explain":"تستخدم append() لإضافة كل مدينة إلى القائمة بعد تنظيف النص.","source":"٢٠٧–٢٠٨"},{"title":"البحث عن كلمة في ملف","section":"الملفات","desc":"يوظف مثال الكتاب قراءة الأسطر وعد مرات ظهور كلمة يكتبها المستخدم.","kind":"book","example":"f = open(\"Riyadh.txt\", \"r\")\nword = input(\"Type a word: \")\ncount = 0\nfor line in f:\n    count += line.count(word)\nf.close()\nprint(count)","explain":"تجمع الحلقة عدد مرات ظهور الكلمة في أسطر الملف. تعتمد النتيجة على محتوى الملف وطريقة مطابقة النص.","source":"٢٠٨–٢٠٩"},{"title":"حساب مجموع الدرجات ومتوسطها من ملف","section":"الملفات","desc":"تُقرأ الدرجات من الملف، وتحوّل إلى أعداد، ثم يُحسب مجموعها ومتوسطها.","kind":"book","example":"grades = [85, 90, 93, 87, 98]\ntotal = sum(grades)\naverage = total / len(grades)\nprint(total)   # 453\nprint(average) # 90.6","explain":"يشرح الكتاب قراءة الدرجات من ملف، ثم تحويلها إلى أعداد، وحساب المجموع والمتوسط وإلحاق النتيجة بالملف.","source":"٢٠٩–٢١١"},{"title":"تدريبات الوحدة والمشروع","section":"مشروع الوحدة","desc":"تتضمن نهاية الوحدة تدريبات على الملفات ومشروع حساب درجات مواد الرياضيات والعلوم والدراسات الاجتماعية.","kind":"book","example":"math = [85, 90, 95]\nscience = [88, 92, 91]\nsocial = [90, 94, 96]\nprint(sum(math) / len(math))","explain":"تطبيق شامل على القوائم والتكرار والمجموع والمتوسط والملفات، يتبعه تقويم مهارات الوحدة.","source":"٢١٢–٢١٧"}];

const detailedExplanations={"list":{"title":"القوسان المربعان [ ]","sample":"fruits = [\"apple\", \"orange\", \"banana\"]","description":"القوس [ يفتح القائمة، والقوس ] يغلقها، والفاصلة , تفصل العناصر. علامة = تخزن القائمة في المتغير fruits. يمكنك تغيير العناصر بعد إنشائها.","parts":["[","apple , orange , banana","]"]},"index":{"title":"القوسان المربعان للوصول إلى عنصر","sample":"fruits = [\"apple\", \"orange\", \"banana\"]\nprint(fruits[0])  # apple\nprint(fruits[2])  # banana\nprint(fruits[-1]) # banana","description":"نكتب اسم القائمة ثم [رقم الفهرس]. يبدأ العد من 0، والفهرس -1 يعني آخر عنصر. القوسان هنا لا ينشئان قائمة جديدة؛ بل يحددان العنصر المطلوب.","parts":["fruits[","0","]"]},"append":{"title":"إضافة عنصر وحذفه","sample":"numbers = [10, 20]\nnumbers.append(30)\nprint(numbers) # [10, 20, 30]\nnumbers.remove(20)\nprint(numbers) # [10, 30]","description":"النقطة . تستدعي عملية من عمليات القائمة. الأقواس الدائرية ( ) بعد append تحتوي العنصر الجديد. أما remove(20) فتحذف العنصر الذي قيمته 20.","parts":[]},"tuple":{"title":"الصف البياني: أقواس دائرية ( )","sample":"colors = (\"red\", \"green\", \"blue\")\nprint(colors[1]) # green","description":"يُنشأ الصف بين ( ) وتُفصل عناصره بفواصل. الصف لا يسمح بتغيير عناصره بعد إنشائه، لكن قراءة عنصر منه تستخدم الأقواس المربعة [ ] مثل القائمة.","parts":["(","red , green , blue",")"]},"library":{"title":"استيراد نموذج برمجي","sample":"import math\nprint(math.floor(3.8)) # 3","description":"الكلمة import تستورد النموذج math، والنقطة . تتيح استخدام دالته floor. الأقواس (3.8) تمرر العدد إلى الدالة.","parts":[]},"sqrt":{"title":"تمرير قيمة إلى دالة","sample":"import math\nprint(math.sqrt(81)) # 9.0","description":"الأقواس الدائرية ( ) تحتوي مُدخل الدالة. sqrt(81) تعني حساب الجذر التربيعي للعدد 81. وتُكتب النتيجة داخل print() لعرضها.","parts":[]},"random":{"title":"اختيار عنصر من قائمة","sample":"import random\ncolors = [\"red\", \"blue\", \"green\"]\nprint(random.choice(colors))","description":"القوسان [ ] يجمعان الخيارات في قائمة، بينما الأقواس ( ) في choice(colors) تحدد القائمة التي ستختار منها الدالة عنصرًا عشوائيًا.","parts":[]},"pip":{"title":"الفرق بين الأمر البرمجي وأمر التثبيت","sample":"python -m pip install pygame","description":"يُكتب هذا الأمر في الطرفية Terminal، وليس داخل ملف أوامر بايثون. وهو يطلب تثبيت حزمة pygame في بيئة بايثون المناسبة.","parts":[]},"gui":{"title":"إنشاء نافذة رسومية","sample":"from tkinter import *\nwindow = Tk()\nwindow.title(\"نافذتي\")\nwindow.mainloop()","description":"Tk() تنشئ النافذة. الأقواس ( ) في title(\"نافذتي\") تمرر نص عنوان النافذة. mainloop() تبقي النافذة قيد التشغيل وتستقبل الأحداث.","parts":[]},"canvas":{"title":"إنشاء لوحة رسم","sample":"canvas = Canvas(window, width=400, height=300, bg=\"white\")\ncanvas.pack()","description":"Canvas() ينشئ مساحة للرسم؛ width وheight يحددان الأبعاد، وbg لون الخلفية. الدالة pack() تعرض اللوحة داخل النافذة.","parts":[]},"coords":{"title":"قراءة الإحداثيات (x, y)","sample":"canvas.create_line(20, 30, 180, 100)","description":"كل نقطتين متتاليتين تمثلان (x, y). يبدأ المحور x من اليسار إلى اليمين، والمحور y من الأعلى إلى الأسفل. هنا يبدأ الخط عند (20,30) وينتهي عند (180,100).","parts":[]},"shapes":{"title":"الأقواس وترتيب قيم الرسم","sample":"canvas.create_rectangle(40, 40, 180, 130, fill=\"teal\")","description":"الأرقام الأربعة داخل ( ) تحدد ركني المستطيل: x1 وy1 ثم x2 وy2. الفواصل تفصل القيم، وfill يحدد لون التعبئة.","parts":[]},"events":{"title":"ربط حدث باستجابة","sample":"canvas.bind(\"<Button-1>\", on_click)","description":"bind() تربط الحدث بدالة. الرمز <Button-1> يشير إلى نقرة زر الفأرة الأيسر. اسم الدالة on_click يُكتب دون أقواس لأنها تُستدعى عند وقوع الحدث.","parts":[]},"dict":{"title":"القاموس: أقواس معقوفة { }","sample":"student = {\"name\": \"Ali\", \"score\": 95}\nprint(student)","description":"القوس { يفتح القاموس و} يغلقه. كل عنصر يتكون من مفتاح : قيمة، وتفصل الفاصلة , بين الأزواج. في المثال المفتاح name مرتبط بالنص Ali.","parts":["{","\"name\": \"Ali\", \"score\": 95","}"]},"dictget":{"title":"الوصول بالمفتاح لا برقم الفهرس","sample":"student = {\"name\": \"Ali\", \"score\": 95}\nprint(student[\"score\"]) # 95","description":"القاموس يُنشأ بالأقواس المعقوفة { }، لكن الوصول إلى قيمة يستخدم [\"اسم المفتاح\"]. هنا لا نكتب [0] للوصول إلى أول عنصر.","parts":[]},"dictedit":{"title":"تعديل قيمة أو إضافة مفتاح","sample":"student = {\"name\": \"Ali\", \"score\": 95}\nstudent[\"score\"] = 100\nstudent[\"class\"] = \"3A\"\ndel student[\"name\"]","description":"القوسان [ ] يحددان المفتاح المطلوب تعديله أو إضافته. التعليمة del تحذف المفتاح وقيمته من القاموس.","parts":[]},"nested":{"title":"قائمة داخل قائمة","sample":"grades = [[90, 85], [70, 95]]","description":"الأقواس المربعة الخارجية [ ] تحتوي قائمتين داخليتين، وكل قائمة داخلية محاطة أيضًا بـ [ ]. الفاصلة بين القائمتين تفصل الصفوف.","parts":["[","[90, 85] , [70, 95]","]"]},"nestedget":{"title":"فهرسان للوصول إلى عنصر داخلي","sample":"grades = [[90, 85], [70, 95]]\nprint(grades[1][0]) # 70","description":"القوس الأول [1] يختار القائمة الداخلية الثانية، ثم القوس الثاني [0] يختار أول عنصر فيها. يبدأ كلا الفهرسين من الصفر.","parts":[]},"matrix":{"title":"صف ثم عمود","sample":"grades = [[90, 85], [70, 95], [88, 92]]\nprint(grades[2][1]) # 92","description":"تخيّل القائمة الخارجية جدولًا: الرقم في القوس الأول يحدد الصف، والرقم في القوس الثاني يحدد العمود. grades[2][1] تعني الصف الثالث والعمود الثاني.","parts":[]},"file":{"title":"فتح ملف: الاسم والنمط بين أقواس","sample":"f = open(\"notes.txt\", \"w\", encoding=\"utf-8\")\nf.write(\"مرحبًا\")\nf.close()","description":"open() تستقبل اسم الملف بين علامتي اقتباس، ثم نمط الفتح. r للقراءة، w للكتابة مع استبدال المحتوى السابق، a للإضافة في نهاية الملف. close() تغلق الملف.","parts":[]},"filedemo":{"title":"الفرق بين الكتابة والقراءة والإلحاق","sample":"with open(\"notes.txt\", \"a\", encoding=\"utf-8\") as f:\n    f.write(\"\\nسطر جديد\")\nwith open(\"notes.txt\", \"r\", encoding=\"utf-8\") as f:\n    print(f.read())","description":"الأقواس في open() تحدد اسم الملف ونمطه. الدالة write() تكتب نصًا، وread() تقرأه. استخدام with يغلق الملف تلقائيًا بعد انتهاء الكتلة.","parts":[]},"project":{"title":"فهم بناء القوائم والدوال","sample":"scores = [90, 80, 95]\nprint(sum(scores)) # 265\nprint(len(scores)) # 3\nprint(sum(scores) / len(scores)) # 88.333...","description":"[ ] تنشئ قائمة الدرجات، و( ) تمرر القائمة إلى الدالتين sum وlen. القسمة / تحسب المتوسط.","parts":[]},"concept":{"title":"أمثلة توضح نوع البيانات","sample":"age = 15\nprice = 3.14\nname = \"Ali\"\npassed = True\nfruits = [\"apple\", \"banana\"]","description":"الأعداد والنصوص والقيم المنطقية أمثلة لهياكل بسيطة. أما القائمة [ ] فتجمع أكثر من قيمة. المخطط الشجري يبين تصنيف الأنواع.","parts":[]}};
function explainStructure(s){let d=detailedExplanations[s.kind];if(!d)return '';let parts=d.parts?.length===3?'<div class="syntax-visual" dir="ltr"><span class="syntax-bracket">'+escapeText(d.parts[0])+'</span><span>'+escapeText(d.parts[1])+'</span><span class="syntax-bracket">'+escapeText(d.parts[2])+'</span></div>':'';return '<section class="explain"><h3>🔎 '+escapeText(d.title)+'</h3>'+parts+'<p>'+escapeText(d.description)+'</p>'+code(d.sample)+'</section>'}
function escapeText(x){return String(x).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function formatLessonTitle(title){return escapeText(title).replace(/([A-Za-z_][A-Za-z_0-9]*\(\))/g,'<bdi dir="ltr" class="function-name">$1</bdi>')}
function render(){let s=slides[page];$('slide').innerHTML='<span class="tag">'+s.section+'</span><h2>'+s.title+'</h2><p class="lead">'+s.desc+'</p>'+explainStructure(s)+'<div class="demo"><h3>🧪 جرّب بنفسك</h3>'+demo(s)+'</div>';$('counter').textContent=(page+1)+' / '+slides.length;$('bar').style.width=((page+1)/slides.length*100)+'%';$('prev').disabled=page===0;$('next').disabled=page===slides.length-1;$('tabs').innerHTML=groups.map(g=>'<button class="'+(g===s.section?'active':'')+'" onclick="go('+slides.findIndex(x=>x.section===g)+')">'+g+'</button>').join('');try{localStorage.setItem('python_unit_slide',page)}catch{}if(s.kind==='functionsTable'){document.querySelectorAll('.book-example-button').forEach(button=>{button.addEventListener('click',()=>{const target=button.dataset.lesson;const n=slides.findIndex(slide=>slide.title===target);if(n>=0)go(n);else{button.textContent='المثال غير موجود';button.disabled=true}})})}if(s.kind==='coords')drawPoint();if(s.kind==='index'){let b=$('indexRun');b.addEventListener('click',()=>{let o=$('out');o.textContent='النتيجة: orange — لأن الفهرس ١ يشير إلى العنصر الثاني';o.style.display='block';o.style.background='#c9f3df';o.style.color='#155b40';let tiles=document.querySelectorAll('#indexChoices .tile');tiles.forEach((t,i)=>{t.style.border=i===1?'3px solid #238c8b':'1px solid #b8d3e0';t.style.background=i===1?'#e2f7ef':'#fff'});});}}
function go(n){page=Math.min(slides.length-1,Math.max(0,n));render();window.scrollTo({top:0,behavior:'instant'})}function showResult(x){$('out').textContent='النتيجة: '+x}function quiz(n,correct){showResult(n===correct?'✅ إجابة صحيحة!':'❌ حاول مرة أخرى')}function drawPoint(){let c=$('cv');if(!c)return;let ctx=c.getContext('2d'),x=+$('x').value,y=+$('y').value;ctx.clearRect(0,0,310,170);ctx.strokeStyle='#aacbd1';ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(310,0);ctx.moveTo(0,0);ctx.lineTo(0,170);ctx.stroke();ctx.fillStyle='#238c8b';ctx.beginPath();ctx.arc(x,y,9,0,7);ctx.fill();showResult('x = '+x+' ، y = '+y)}function drawShape(type){let c=$('cv').getContext('2d');c.clearRect(0,0,310,170);c.fillStyle='#238c8b';if(type==='rect')c.fillRect(40,40,180,90);else{c.beginPath();c.arc(150,85,55,0,7);c.fill()}}function saveText(){try{localStorage.setItem('python_demo_file',$('fileText').value);showResult('تم الحفظ داخل المحاكاة')}catch{showResult('الحفظ غير متاح في هذا المتصفح')}}function readText(){showResult(localStorage.getItem('python_demo_file')??'لا يوجد نص محفوظ')}function calcProject(){let names=['الرياضيات','العلوم','الدراسات الاجتماعية'],ids=['math','science','social'];let arr=ids.map(id=>$(id).value.split(',').map(Number));if(arr.some(a=>a.length!==3||a.some(n=>!Number.isFinite(n)||n<0||n>100))){showResult('أدخل ثلاث درجات صحيحة من 0 إلى 100 لكل مادة');return}let av=arr.map(a=>a.reduce((x,y)=>x+y,0)/a.length),top=av.indexOf(Math.max(...av)),count=arr.flat().filter(x=>x===19).length;showResult('متوسط جميع الدرجات: '+(arr.flat().reduce((a,b)=>a+b,0)/9).toFixed(1)+' | أعلى متوسط: '+names[top]+' ('+av[top].toFixed(1)+') | تكرار الدرجة 19: '+count)}$('prev').onclick=()=>go(page-1);$('next').onclick=()=>go(page+1);render();
</script></body></html>
