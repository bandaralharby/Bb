<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الوحدة الرابعة | البرمجة مع بايثون</title><style>
:root{--navy:#173957;--teal:#238c8b;--bg:#f3f8fc;--line:#d9e6ef}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--navy);font-family:Tahoma,Arial,sans-serif;line-height:1.9}header{background:linear-gradient(120deg,#133554,#268e90);color:white;padding:20px 5vw;box-shadow:0 4px 20px #1234}header h1{margin:0;font-size:clamp(21px,3vw,35px)}header small{opacity:.88}.tabs{display:flex;gap:8px;overflow:auto;padding:13px 5vw;background:white;position:sticky;top:0;z-index:3;border-bottom:1px solid var(--line)}.tabs button{white-space:nowrap;border:1px solid var(--line);background:white;border-radius:12px;padding:10px 16px;color:var(--navy);cursor:pointer}.tabs button.active{background:var(--teal);color:white}.wrap{max-width:1100px;margin:24px auto 125px;padding:0 18px}.card{background:white;border:1px solid var(--line);border-radius:24px;padding:clamp(18px,4vw,38px);box-shadow:0 12px 35px #14365210}.tag{display:inline-block;background:#e5f5f2;color:#217a78;padding:5px 17px;border-radius:30px;font-weight:bold}.card h2{font-size:clamp(28px,4.5vw,49px);line-height:1.35;margin:18px 0}.lead{font-size:clamp(17px,2.4vw,23px);color:#4c677c}.demo{background:#f3f8fc;border:1px solid var(--line);padding:22px;border-radius:20px;margin-top:26px}.demo h3{margin-top:0}pre{direction:ltr;text-align:left;white-space:pre-wrap;overflow-wrap:anywhere;background:#142c43;color:#d6f4ef;border-radius:14px;padding:18px;font-size:clamp(13px,1.8vw,18px);line-height:1.7}button.action{border:0;background:#287eaa;color:white;border-radius:12px;padding:11px 20px;font:inherit;cursor:pointer;margin:5px}button.action.secondary{background:#e2edf3;color:#19405d}input,select,textarea{font:inherit;padding:10px;border:1px solid #bed4df;border-radius:10px;max-width:100%}textarea{width:100%;min-height:80px}output,.result{display:block;background:#e5f5f2;color:#185d5c;border-radius:12px;padding:12px 16px;margin-top:12px;min-height:50px;font-weight:bold}footer{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px max(14px,calc((100vw - 1050px)/2));z-index:4}footer button{border:0;border-radius:13px;padding:11px 20px;background:#347ba6;color:white;font:inherit;cursor:pointer}footer button:disabled{opacity:.35}#progress{height:6px;background:#dbe7ee}#bar{height:100%;width:0;background:#2eaaa1;transition:width .3s}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}.tile{background:#fff;border:1px solid #b8d3e0;border-radius:14px;padding:16px;text-align:center;cursor:pointer}.tile:focus{outline:3px solid #4b9}.visual{height:200px;background:linear-gradient(130deg,#d7f4f0,#dce9fa);border-radius:18px;display:grid;place-items:center;margin-top:20px}.visual span{font-size:75px}.hint{font-size:14px;color:#627d91}.chip{display:inline-block;background:#e7edf6;padding:8px 15px;border-radius:10px;margin:4px}canvas{max-width:100%;background:white;border:1px solid #aacbd1;border-radius:10px} @media(max-width:500px){footer button{padding:10px 13px}.wrap{margin-top:14px}.demo{padding:14px}}
</style></head><body><header><small>المهارات الرقمية • الصف الثالث المتوسط</small><h1>الوحدة الرابعة: البرمجة مع بايثون</h1><div>تعلّم • جرّب • اكتشف • طبّق</div></header><nav class="tabs" id="tabs"></nav><div id="progress"><div id="bar"></div></div><main class="wrap"><article class="card" id="slide"></article></main><footer><button id="prev">→ السابق</button><b id="counter"></b><button id="next">التالي ←</button></footer><script>
const slides=[{"title": "انطلاقة إلى عالم بايثون", "section": "مقدمة الوحدة", "desc": "تتعلم في هذه الوحدة كيف تنظم البيانات، وتستفيد من المكتبات، وتصمم واجهات رسومية، وتحفظ المعلومات في ملفات.", "kind": "intro"}, {"title": "هياكل البيانات", "section": "القوائم وصفوف البيانات", "desc": "هي طرق لتنظيم البيانات وتخزينها؛ منها البسيطة مثل الأعداد والنصوص، وغير البسيطة مثل القوائم والقواميس.", "kind": "concept"}, {"title": "أنشئ قائمة", "section": "القوائم وصفوف البيانات", "desc": "القائمة تجمع عناصر مرتبة بين قوسين مربعين، ويمكن تغيير عناصرها وإضافة عناصر جديدة.", "kind": "list"}, {"title": "الوصول إلى عناصر القائمة", "section": "القوائم وصفوف البيانات", "desc": "يبدأ فهرس عناصر القائمة من الصفر؛ العنصر الأول رقمه 0 والثاني رقمه 1.", "kind": "index"}, {"title": "إضافة وحذف العناصر", "section": "القوائم وصفوف البيانات", "desc": "تضيف append عنصرًا في نهاية القائمة، وتحذف pop عنصرًا من القائمة.", "kind": "append"}, {"title": "صفوف البيانات Tuple", "section": "القوائم وصفوف البيانات", "desc": "صف البيانات يشبه القائمة، لكنه غير قابل لتعديل عناصره بعد إنشائه، ويُكتب عادة بين قوسين دائريين.", "kind": "tuple"}, {"title": "اختبر فهمك: القوائم", "section": "القوائم وصفوف البيانات", "desc": "ما رقم فهرس أول عنصر في قائمة بايثون؟", "kind": "quiz:0|1|2|0"}, {"title": "لماذا نستخدم المكتبات؟", "section": "المكتبات البرمجية", "desc": "المكتبة مجموعة تعليمات برمجية جاهزة نعيد استخدامها لتوفير الوقت والجهد.", "kind": "concept"}, {"title": "المكتبات القياسية", "section": "المكتبات البرمجية", "desc": "تضم بايثون مكتبات جاهزة، مثل math للحسابات وrandom للاختيار العشوائي.", "kind": "library"}, {"title": "جرّب دوال الرياضيات", "section": "المكتبات البرمجية", "desc": "استخدم دالة الجذر التربيعي من مكتبة math لحساب جذر عدد.", "kind": "sqrt"}, {"title": "الاختيار العشوائي", "section": "المكتبات البرمجية", "desc": "يمكن اختيار قيمة عشوائية من مجموعة قيم باستخدام random.choice.", "kind": "random"}, {"title": "مدير الحزم pip", "section": "المكتبات البرمجية", "desc": "يُستخدم pip لتثبيت مكتبات إضافية عند توفر بيئة بايثون مناسبة واتصال مطلوب.", "kind": "pip"}, {"title": "اختبر فهمك: المكتبات", "section": "المكتبات البرمجية", "desc": "ما فائدة المكتبات البرمجية؟", "kind": "quiz:إعادة استخدام أكواد جاهزة|حذف بايثون|منع كتابة البرامج|0"}, {"title": "مرحبًا بالواجهات الرسومية", "section": "بناء الواجهات الرسومية", "desc": "تساعد Tkinter في بناء نوافذ وعناصر تفاعل، مثل الأزرار ولوحة الرسم Canvas.", "kind": "gui"}, {"title": "لوحة الرسم Canvas", "section": "بناء الواجهات الرسومية", "desc": "تحدد مساحة الرسم، لون الخلفية، وأبعاد النافذة قبل رسم الأشكال.", "kind": "canvas"}, {"title": "الإحداثيات", "section": "بناء الواجهات الرسومية", "desc": "تُحدد مواضع الرسم باستخدام قيم x وy؛ تزداد x إلى اليمين وy إلى الأسفل.", "kind": "coords"}, {"title": "رسم الأشكال", "section": "بناء الواجهات الرسومية", "desc": "يمكن رسم خطوط ومستطيلات وأشكال بيضاوية على Canvas.", "kind": "shapes"}, {"title": "الأحداث والتفاعل", "section": "بناء الواجهات الرسومية", "desc": "تستجيب الواجهات الرسومية لأحداث مثل النقر بالفأرة والضغط على لوحة المفاتيح.", "kind": "events"}, {"title": "اختبر فهمك: Tkinter", "section": "بناء الواجهات الرسومية", "desc": "ما العنصر المستخدم للرسم داخل نافذة Tkinter؟", "kind": "quiz:Canvas|print|input|0"}, {"title": "ما القاموس؟", "section": "القواميس", "desc": "القاموس يخزن أزواجًا من المفاتيح والقيم، مثل اسم الطالب ودرجته.", "kind": "dict"}, {"title": "الوصول إلى القيم", "section": "القواميس", "desc": "يمكن قراءة قيمة القاموس بذكر مفتاحها بين أقواس مربعة.", "kind": "dictget"}, {"title": "تعديل القاموس", "section": "القواميس", "desc": "يمكن إضافة مفتاح جديد أو تغيير قيمة مفتاح موجود، وكذلك حذف مفتاح.", "kind": "dictedit"}, {"title": "اختبر فهمك: القواميس", "section": "القواميس", "desc": "أي تركيب يربط اسمًا بقيمة؟", "kind": "quiz:القاموس|العدد الصحيح|السلسلة النصية|0"}, {"title": "القوائم المتداخلة", "section": "القوائم المتداخلة", "desc": "يمكن أن تحتوي قائمة على قائمة أخرى، مثل جدول درجات عدة طلاب.", "kind": "nested"}, {"title": "الوصول إلى قيمة متداخلة", "section": "القوائم المتداخلة", "desc": "استخدم فهرسين متتاليين: الأول لاختيار القائمة الداخلية، والثاني لاختيار عنصر منها.", "kind": "nestedget"}, {"title": "تحدي درجات الطلاب", "section": "القوائم المتداخلة", "desc": "تأمل الجدول، ثم اختر الصف والعمود لعرض الدرجة المقابلة.", "kind": "matrix"}, {"title": "لماذا نستخدم الملفات؟", "section": "الملفات", "desc": "تُفقد البيانات الموجودة في ذاكرة التشغيل عند إغلاق البرنامج، بينما تبقى البيانات المحفوظة في الملفات.", "kind": "concept"}, {"title": "فتح ملف نصي", "section": "الملفات", "desc": "تستخدم open لفتح الملف، مع تحديد نمط مثل r للقراءة أو w للكتابة أو a للإلحاق.", "kind": "file"}, {"title": "الكتابة والقراءة", "section": "الملفات", "desc": "يمكن كتابة نص إلى ملف وقراءته لاحقًا. هذا المثال يحاكي ملفًا نصيًا داخل الدرس دون الوصول إلى ملفات جهازك.", "kind": "filedemo"}, {"title": "مشروع الوحدة: حساب الدرجات", "section": "مشروع الوحدة", "desc": "أنشئ قوائم درجات للرياضيات والعلوم والدراسات الاجتماعية، ثم احسب المتوسط وحدد المادة الأعلى.", "kind": "project"}, {"title": "تحدي الختام", "section": "التقويم النهائي", "desc": "أكملت رحلة البرمجة مع بايثون. اختبر مهاراتك ثم جرّب كتابة البرامج على بيئة بايثون حقيقية.", "kind": "final"}];
const groups=[...new Set(slides.map(x=>x.section))];let page=(()=>{try{let n=Number(localStorage.getItem('python_unit_slide'));return Number.isInteger(n)&&n>=0&&n<slides.length?n:0}catch{return 0}})();
const $=id=>document.getElementById(id);const code=(s)=>'<pre>'+s.replaceAll('&','&amp;').replaceAll('<','&lt;')+'</pre>';const btn=(label,fn)=>'<button class="action" onclick="'+fn+'">'+label+'</button>';const out='<output id="out">اضغط على الزر لتجربة المثال</output>';
function demo(s){let k=s.kind, t='';switch(k){
case 'intro':t='<div class="visual"><span>💻</span></div><p>ستتعلم كتابة أوامر بايثون خطوة بخطوة، مع محاكاة النتائج داخل هذه الصفحة.</p>';break;
case 'concept':t='<div class="grid"><div class="tile">📦 تنظيم البيانات</div><div class="tile">🧩 بناء البرامج</div><div class="tile">⚙️ تنفيذ الأوامر</div></div>';break;
case 'list':t=code('fruits = ["apple", "orange", "banana"]\nprint(fruits)')+btn('شغّل المثال','showResult(`[\'apple\', \'orange\', \'banana\']`)')+out;break;
case 'index':t=code('fruits = ["apple", "orange", "banana"]\nprint(fruits[1])')+'<div class="grid"><div class="tile">0<br>apple</div><div class="tile">1<br>orange</div><div class="tile">2<br>banana</div></div>'+btn('اعرض العنصر 1','showResult("orange")')+out;break;
case 'append':t=code('items = [1, 2]\nitems.append(3)\nprint(items)')+btn('إضافة 3','showResult("[1, 2, 3]")')+out;break;
case 'tuple':t=code('colors = ("red", "green", "blue")\nprint(colors[0])')+btn('اعرض أول لون','showResult("red")')+out;break;
case 'library':t=code('import math\nprint(math.floor(3.8))')+btn('نفّذ','showResult("3")')+out;break;
case 'sqrt':t=code('import math\nprint(math.sqrt(عدد))')+'<label>اختر العدد: <input type="number" id="num" value="81" min="0"></label>'+btn('احسب الجذر','showResult(Math.sqrt(Math.max(0,Number($("num").value))))')+out;break;
case 'random':t=code('import random\nprint(random.choice(["أحمر", "أزرق", "أخضر"]))')+btn('اختر لونًا عشوائيًا','showResult(["أحمر","أزرق","أخضر"][Math.floor(Math.random()*3)])')+out;break;
case 'pip':t=code('python -m pip install package_name')+'<p class="hint">هذا مثال توضيحي للأمر، وليس زر تثبيت حقيقيًا. يلزم تنفيذ الأمر داخل بيئة بايثون.</p>';break;
case 'gui':t=code('from tkinter import *\nwindow = Tk()\nwindow.title("نافذتي")\nwindow.mainloop()')+'<div class="visual"><div style="background:white;border:3px solid #2b8b8c;border-radius:15px;width:75%;box-shadow:0 8px 25px #2343"><div style="background:#258e8d;color:white;padding:5px 12px">نافذتي — Python</div><div style="padding:18px;text-align:center">مرحبًا بك في Tkinter</div></div></div>';break;
case 'canvas':t=code('canvas = Canvas(bg="teal", width=400, height=400)\ncanvas.pack()')+'<div class="visual" style="background:teal;color:white;font-size:28px">Canvas — لوحة الرسم</div>';break;
case 'coords':t='<p>حرّك النقطة بتغيير الإحداثيات:</p><label>X <input id="x" type="range" min="10" max="290" value="90" oninput="drawPoint()"></label> <label>Y <input id="y" type="range" min="10" max="150" value="80" oninput="drawPoint()"></label><div><canvas id="cv" width="310" height="170"></canvas></div>'+out;break;
case 'shapes':t=code('canvas.create_rectangle(40, 40, 180, 130, fill="teal")')+'<canvas id="cv" width="310" height="170"></canvas>'+btn('ارسم مستطيلًا','drawShape("rect")')+btn('ارسم دائرة','drawShape("circle")');break;
case 'events':t='<div class="visual" id="eventBox" onclick="this.style.background=this.style.background===\'rgb(180, 235, 209)\'?\'#dce9fa\':\'#b4ebd1\';showResult(\'تم التقاط حدث النقر!\')" style="cursor:pointer"><b>👆 اضغط داخل المساحة</b></div>'+out;break;
case 'dict':t=code('student = {"name": "Ali", "score": 95}\nprint(student)')+btn('اعرض القاموس','showResult("{name: Ali, score: 95}")')+out;break;
case 'dictget':t=code('student = {"name": "Ali", "score": 95}\nprint(student["score"])')+btn('اقرأ الدرجة','showResult("95")')+out;break;
case 'dictedit':t=code('student = {"name": "Ali", "score": 95}\nstudent["score"] = 100\nprint(student["score"])')+btn('عدّل الدرجة','showResult("100")')+out;break;
case 'nested':t=code('grades = [[90, 85], [70, 95]]\nprint(grades)')+'<div class="grid"><div class="tile">الطالب الأول<br>90 ، 85</div><div class="tile">الطالب الثاني<br>70 ، 95</div></div>';break;
case 'nestedget':t=code('grades = [[90, 85], [70, 95]]\nprint(grades[1][0])')+btn('نفّذ','showResult("70")')+out;break;
case 'matrix':t='<p>اختر رقم الطالب ورقم الاختبار:</p><select id="row"><option value="0">الطالب الأول</option><option value="1">الطالب الثاني</option><option value="2">الطالب الثالث</option></select> <select id="col"><option value="0">الاختبار الأول</option><option value="1">الاختبار الثاني</option></select>'+btn('اعرض الدرجة','showResult([[90,85],[70,95],[88,92]][Number($("row").value)][Number($("col").value)])')+out;break;
case 'file':t=code('with open("notes.txt", "w", encoding="utf-8") as f:\n    f.write("مرحبًا بايثون")')+'<p class="hint">w يكتب ملفًا جديدًا أو يستبدل المحتوى، وa يضيف إلى نهايته، وr يقرأ المحتوى.</p>';break;
case 'filedemo':t=code('with open("notes.txt", "w", encoding="utf-8") as f:\n    f.write("مرحبًا بايثون")')+'<textarea id="fileText">مرحبًا بايثون</textarea>'+btn('احفظ داخل المحاكاة','saveText()')+btn('اقرأ النص المحفوظ','readText()')+out+'<p class="hint">المحاكاة تحفظ النص في متصفحك فقط، ولا تنشئ ملفًا حقيقيًا على الجهاز.</p>';break;
case 'project':t='<p>أدخل ثلاث درجات لكل مادة، مفصولة بفاصلة:</p><label>الرياضيات <input id="math" value="90,80,95"></label><p><label>العلوم <input id="science" value="85,88,92"></label></p><p><label>الدراسات الاجتماعية <input id="social" value="78,90,86"></label></p>'+btn('احسب النتائج','calcProject()')+out;break;
case 'final':t='<div class="visual"><span>🏆</span></div><p>أحسنت! أنجزت دروس الوحدة الرابعة. يمكنك الرجوع إلى أي درس من القائمة العلوية.</p>'+btn('العودة إلى البداية','go(0)');break;
default:if(k.startsWith('quiz:')){let a=k.slice(5).split('|');t='<div class="grid">'+a.slice(0,3).map((v,i)=>'<button class="tile" onclick="quiz('+i+','+Number(a[3])+')">'+v+'</button>').join('')+'</div>'+out;} }
return t;}
function render(){let s=slides[page];$('slide').innerHTML='<span class="tag">'+s.section+'</span><h2>'+s.title+'</h2><p class="lead">'+s.desc+'</p><div class="demo"><h3>🧪 جرّب بنفسك</h3>'+demo(s)+'</div>';$('counter').textContent=(page+1)+' / '+slides.length;$('bar').style.width=((page+1)/slides.length*100)+'%';$('prev').disabled=page===0;$('next').disabled=page===slides.length-1;$('tabs').innerHTML=groups.map(g=>'<button class="'+(g===s.section?'active':'')+'" onclick="go('+slides.findIndex(x=>x.section===g)+')">'+g+'</button>').join('');try{localStorage.setItem('python_unit_slide',page)}catch{}if(s.kind==='coords')drawPoint();}
function go(n){page=Math.min(slides.length-1,Math.max(0,n));render();window.scrollTo({top:0,behavior:'smooth'})}function showResult(x){$('out').textContent='النتيجة: '+x}function quiz(n,correct){showResult(n===correct?'✅ إجابة صحيحة!':'❌ حاول مرة أخرى')}function drawPoint(){let c=$('cv');if(!c)return;let ctx=c.getContext('2d'),x=+$('x').value,y=+$('y').value;ctx.clearRect(0,0,310,170);ctx.strokeStyle='#aacbd1';ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(310,0);ctx.moveTo(0,0);ctx.lineTo(0,170);ctx.stroke();ctx.fillStyle='#238c8b';ctx.beginPath();ctx.arc(x,y,9,0,7);ctx.fill();showResult('x = '+x+' ، y = '+y)}function drawShape(type){let c=$('cv').getContext('2d');c.clearRect(0,0,310,170);c.fillStyle='#238c8b';if(type==='rect')c.fillRect(40,40,180,90);else{c.beginPath();c.arc(150,85,55,0,7);c.fill()}}function saveText(){try{localStorage.setItem('python_demo_file',$('fileText').value);showResult('تم الحفظ داخل المحاكاة')}catch{showResult('الحفظ غير متاح في هذا المتصفح')}}function readText(){showResult(localStorage.getItem('python_demo_file')??'لا يوجد نص محفوظ')}function calcProject(){let names=['الرياضيات','العلوم','الدراسات الاجتماعية'],ids=['math','science','social'];let arr=ids.map(id=>$(id).value.split(',').map(Number));if(arr.some(a=>a.length!==3||a.some(n=>!Number.isFinite(n)||n<0||n>100))){showResult('أدخل ثلاث درجات صحيحة من 0 إلى 100 لكل مادة');return}let av=arr.map(a=>a.reduce((x,y)=>x+y,0)/a.length),top=av.indexOf(Math.max(...av)),count=arr.flat().filter(x=>x===19).length;showResult('متوسط جميع الدرجات: '+(arr.flat().reduce((a,b)=>a+b,0)/9).toFixed(1)+' | أعلى متوسط: '+names[top]+' ('+av[top].toFixed(1)+') | تكرار الدرجة 19: '+count)}$('prev').onclick=()=>go(page-1);$('next').onclick=()=>go(page+1);render();
</script></body></html>
